  <!-- 1. Contorno da mama direita. -->
  <g transform="translate(50 1090) scale(.1 -.1)" fill="#050505">
    <use href="#breast-contour"/>
  </g>

  <!-- 2. Contorno da mama esquerda, isolado e vetorizado separadamente. -->
  <g transform="translate(818 1090) scale(.1 -.1)" fill="#050505">
    <use href="#left-breast-contour"/>
  </g>

  <!-- 3. Complexos aréolo-mamilares. -->
  <g fill="#fff" stroke="#050505" stroke-width="9">
    <circle cx="435" cy="686" r="68"/>
    <circle cx="1208" cy="686" r="68"/>
  </g>
  <g fill="#050505">
    <circle cx="435" cy="686" r="25"/>
    <circle cx="1208" cy="686" r="25"/>
  </g>

